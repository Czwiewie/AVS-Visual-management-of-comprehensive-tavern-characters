;render()};document.getElementById('previous').onclick=()=>{page--;render()};document.getElementById('next').onclick=()=>{page++;render()};document.getElementById('grid').onclick=e=>{const b=e.target.closest('[data-photo]');if(!b)return;const item=DATA.entries.find(x=>x.id===b.dataset.photo);document.getElementById('title').textContent=item.label;document.getElementById('photo').src=item.image;document.getElementById('tags').textContent=item.text;document.getElementById('scope').textContent=item.scope;document.getElementById('preview').showModal()};document.getElementById('close').onclick=()=>document.getElementById('preview').close();render();</script></html>
